services:

  frontend:
    build:
      context: ./frontend
    container_name: employeehub-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: employeehub-backend
    ports:
      - "8000:8000"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: employeehub
      DB_USER: employeehub_user
      DB_PASSWORD: change_me
    depends_on:
      - database

  database:
    image: postgres:16
    container_name: employeehub-database
    environment:
      POSTGRES_DB: employeehub
      POSTGRES_USER: employeehub_user
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: