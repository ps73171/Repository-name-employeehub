apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: employeehub
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ps73171/Repository-name-employeehub.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: employeehub

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true